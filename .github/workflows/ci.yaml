name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Download outside Jest's 60-second database setup hook.
      - name: Prepare test database binary
        run: node --input-type=module -e "import { MongoBinary } from 'mongodb-memory-server'; await MongoBinary.getPath();"

      - name: Run the test suite
        run: npm test -- --runInBand

      - name: Build the client
        run: npm run build --workspace client
