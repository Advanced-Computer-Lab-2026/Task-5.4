name: Tests

# Run the test suite on every pull request, and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Keep the MongoDB binary used by mongodb-memory-server between runs,
      # so it is only downloaded once instead of on every pull request.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # Download MongoDB before the tests start, so the tests' 60s
      # beforeAll timeout is not spent on the download.
      - name: Pre-download MongoDB
        run: node -e "import('mongodb-memory-server').then(async m => { const s = await m.MongoMemoryServer.create(); await s.stop(); console.log('MongoDB ready') })"

      # The tests set their own JWT_SECRET / CSRF_SECRET and use an in-memory
      # database, so no secrets or .env file are needed here.
      - name: Run tests
        run: npm test
